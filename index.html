  </head>

  <body>
    <div id="root"></div>
    <div id="app-splash" style="position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:radial-gradient(circle at 30% 20%,#0ea5e9 0%,#0f172a 55%,#020617 100%);font-family:'Plus Jakarta Sans',system-ui,sans-serif;">
      <div style="position:relative;width:112px;height:112px;">
        <div style="position:absolute;inset:-14px;border-radius:9999px;background:conic-gradient(from 0deg,#38bdf8,#a855f7,#34d399,#38bdf8);filter:blur(18px);opacity:.7;animation:splashSpin 3s linear infinite;"></div>
        <img src="/pictures/20eb7d56-b963-4a41-9830-eead460b0120.png" alt="MNR" style="position:relative;width:112px;height:112px;border-radius:9999px;background:#fff;padding:10px;object-fit:contain;box-shadow:0 20px 40px rgba(0,0,0,.4);"/>
      </div>
      <div style="color:#fff;font-weight:700;font-size:18px;letter-spacing:.02em;">MNR Group IT</div>
      <div style="display:flex;gap:6px;">
        <span style="width:8px;height:8px;border-radius:9999px;background:#38bdf8;animation:splashDot 1.2s infinite ease-in-out;"></span>
        <span style="width:8px;height:8px;border-radius:9999px;background:#a855f7;animation:splashDot 1.2s infinite ease-in-out .15s;"></span>
        <span style="width:8px;height:8px;border-radius:9999px;background:#34d399;animation:splashDot 1.2s infinite ease-in-out .3s;"></span>
      </div>
      <style>
        @keyframes splashSpin{to{transform:rotate(360deg)}}
        @keyframes splashDot{0%,80%,100%{transform:scale(.6);opacity:.5}40%{transform:scale(1);opacity:1}}
        #app-splash.hide{opacity:0;pointer-events:none;transition:opacity .4s ease}
      </style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
